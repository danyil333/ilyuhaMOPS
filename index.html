<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What is a HighTierHuman to a LowTierGod?</title>
<style>
body {
    background-color:#34cfeb;
    text-align:center;
    font-family:'Gill Sans', sans-serif;
}
button {
    width:350px;
    max-width:90vw;
    height:120px;
    font-size:42px;
    font-weight:bold;
    cursor:pointer;
}
button:disabled {
    cursor:wait;
    opacity:0.6;
}
#gif {
    visibility:hidden;
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    object-fit:cover;
    z-index:9999;
}
</style>
</head>
<body>

<div id="test">
    <h1>НАЖМИ ЙООООУУ</h1>
    <button id="btn" onclick="start()" disabled>...</button>
</div>

<img id="gif" src="hehehe777.gif" decoding="async" fetchpriority="high">

<!-- запасной вариант, если Web Audio недоступен (например, при открытии через file://) -->
<audio id="sound" preload="auto"></audio>

<script>
const btn = document.getElementById("btn");
const gif = document.getElementById("gif");
const sound = document.getElementById("sound");

const ctx = new (window.AudioContext || window.webkitAudioContext)();
let buffer = null;

// OGG в 10 раз меньше WAV; если браузер его не умеет (старый Safari), берём WAV
const canOgg = !!sound.canPlayType('audio/ogg; codecs="vorbis"');
const soundUrl = canOgg ? "screamer1.ogg" : "screamer1.wav";
sound.src = soundUrl;

// 1. Гифка полностью загружена
const gifReady = new Promise(res => {
    if (gif.complete && gif.naturalWidth) res();
    else { gif.onload = res; gif.onerror = res; }
});

// 2. Звук загружен и декодирован заранее
const audioReady = fetch(soundUrl)
    .then(r => r.arrayBuffer())
    .then(d => ctx.decodeAudioData(d))
    .then(b => { buffer = b; })
    .catch(() => { /* останется обычный <audio> */ });

// Кнопка активна, только когда всё готово
Promise.all([gifReady, audioReady]).then(() => {
    btn.disabled = false;
    btn.innerHTML = "&gt;&gt;&gt;";
});

function start() {
    document.getElementById("test").innerHTML = "<h1>...</h1>";
    gif.style.visibility = "visible";

    if (buffer) {
        if (ctx.state === "suspended") ctx.resume();
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        src.start(0);
    } else {
        sound.currentTime = 0;
        sound.play();
    }
}
</script>

</body>
</html>
