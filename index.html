<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What is a HighTierHuman to a LowTierGod?</title>
<style>
body {
    background-color:#34cfeb;
    text-align:center;
    font-family:'Gill Sans', sans-serif;
}
button {
    width:350px;
    max-width:90vw;
    height:120px;
    font-size:42px;
    font-weight:bold;
    cursor:pointer;
}
button:disabled {
    cursor:wait;
    opacity:0.6;
}
#vid {
    visibility:hidden;
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    object-fit:cover;
    background:#000;
    z-index:9999;
}
</style>
</head>
<body>

<div id="test">
    <h1>НАЖМИ ЙООООУУ</h1>
    <button id="btn" onclick="start()" disabled>...</button>
</div>

<video id="vid" playsinline loop preload="auto"></video>

<script>
const btn = document.getElementById("btn");
const vid = document.getElementById("vid");
const url = "screamer.mp4";

function enable() {
    btn.disabled = false;
    btn.innerHTML = "&gt;&gt;&gt;";
}


fetch(url, { cache: "force-cache" })
    .then(r => r.arrayBuffer())
    .catch(() => {})
    .then(() => {
        vid.src = url;
        vid.load();
        enable();
    });

function show() {
    vid.style.visibility = "visible";
}

function start() {
    document.getElementById("test").innerHTML = "<h1>...</h1>";
    vid.currentTime = 0;
    vid.muted = false;
    vid.volume = 1;

    if ("requestVideoFrameCallback" in vid) {
        vid.requestVideoFrameCallback(show);
    } else {
        vid.addEventListener("playing", show, { once: true });
    }

    vid.play().catch(() => {
        
        vid.muted = true;
        vid.play();
    });
}
</script>

</body>
</html>
