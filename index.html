<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What is a HighTierHuman to a LowTierGod?</title>
<style>
body {
    background-color:#34cfeb;
    text-align:center;
    font-family:'Gill Sans', sans-serif;
}
button {
    width:350px;
    max-width:90vw;
    height:120px;
    font-size:42px;
    font-weight:bold;
    cursor:pointer;
}
button:disabled {
    cursor:wait;
    opacity:0.6;
}
#vid {
    visibility:hidden;
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    object-fit:cover;
    background:#000;
    z-index:9999;
}
</style>
</head>
<body>

<div id="test">
    <h1>НАЖМИ ЙООООУУ</h1>
    <button id="btn" onclick="start()" disabled>...</button>
</div>

<video id="vid" playsinline loop preload="auto"></video>

<script>
const btn = document.getElementById("btn");
const vid = document.getElementById("vid");
const url = "screamer.mp4";

function enable() {
    btn.disabled = false;
    btn.innerHTML = "&gt;&gt;&gt;";
}

// Ждём, пока видео будет готово к проигрыванию без пауз
vid.addEventListener("canplaythrough", enable, { once: true });

// Скачиваем файл целиком заранее (работает через http/https).
// Если не получилось (например, file://), играем напрямую по ссылке.
fetch(url)
    .then(r => r.blob())
    .then(b => { vid.src = URL.createObjectURL(b); })
    .catch(() => { vid.src = url; });

// Запасной таймер на случай, если canplaythrough не сработает
setTimeout(enable, 8000);

function start() {
    document.getElementById("test").innerHTML = "<h1>...</h1>";
    vid.currentTime = 0;
    vid.muted = false;
    vid.volume = 1;

    // Показываем видео ровно в тот момент, когда пошёл первый кадр
    vid.addEventListener("playing", () => {
        vid.style.visibility = "visible";
    }, { once: true });

    vid.play().catch(() => {
        // если браузер не дал включить звук, запускаем без него
        vid.muted = true;
        vid.play();
    });
}
</script>

</body>
</html>
